
{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <h4 class="page-title">Programs</h4>

        <div class="row">
            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">
                            {% if object %}
                                Update Program
                            {% else %}
                                Add New Program
                            {% endif %}
                        </div>
                    </div>

                    <div class="card-body">

                        <form action="" method="post">

                            {% csrf_token %}

                            {% include 'includes/form.html' %}

                            <button type="submit"
                                    class="btn btn-primary">
                                Submit
                            </button>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
