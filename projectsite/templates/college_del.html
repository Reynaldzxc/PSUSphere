
{% extends 'base.html' %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <h4 class="page-title">Colleges</h4>

        <div class="row">
            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">
                            Delete College
                        </div>
                    </div>

                    <div class="card-body">

                        <p>
                            Are you sure you want to delete
                            "{{ object }}"?
                        </p>

                        <form method="post">
                            {% csrf_token %}

                            <button type="submit"
                                    class="btn btn-danger">
                                Delete
                            </button>

                            <a href="{% url 'college-list' %}"
                               class="btn btn-secondary">
                                Cancel
                            </a>
                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
