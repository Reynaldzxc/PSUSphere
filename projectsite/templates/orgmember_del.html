
{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="content">
    <div class="container-fluid">

        <h4 class="page-title">Org. Members</h4>

        <div class="row">
            <div class="col-md-12">

                <div class="card">

                    <div class="card-header">
                        <div class="card-title">
                            Delete Organization Member
                        </div>

                        <div class="card-category">
                            Page Subtitle
                        </div>
                    </div>

                    <div class="card-body">

                        <form action="" method="post">

                            {% csrf_token %}

                            <p>
                                Are you sure you want to delete
                                "{{ object }}"?
                            </p>

                            <button type="submit"
                                    class="btn btn-primary">
                                Submit
                            </button>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </div>
</div>

{% endblock %}
